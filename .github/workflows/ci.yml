name: SupportPilot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore SupportPilot.sln

      - name: Build Solution
        run: dotnet build SupportPilot.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test SupportPilot.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  frontend-build:
    name: Frontend Build & Typecheck (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck & Build Bundle
        run: npm run build

  docker-validate:
    name: Docker Compose Production Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Development Compose
        run: docker compose config

      - name: Validate Production Compose
        run: docker compose -f docker-compose.prod.yml config
