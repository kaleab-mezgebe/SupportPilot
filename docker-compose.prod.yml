version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supportpilot-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportpilot_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-supportpilot_prod_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - supportpilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportpilot} -d ${POSTGRES_DB:-supportpilot_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: supportpilot-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    networks:
      - supportpilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: backend/SupportPilot.Api/Dockerfile
    container_name: supportpilot-backend-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-supportpilot_prod_db};Username=${POSTGRES_USER:-supportpilot};Password=${POSTGRES_PASSWORD:-supportpilot_prod_secret}
      - Jwt__Key=${JWT_SECRET_KEY:-SupportPilot_Super_Secret_Production_Key_2026_Minimum_32_Chars_Length!}
      - Jwt__Issuer=SupportPilot.Api
      - Jwt__Audience=SupportPilot.Client
      - Llm__Provider=${LLM_PROVIDER:-local}
      - Llm__OpenAiApiKey=${OPENAI_API_KEY:-}
      - Llm__GeminiApiKey=${GEMINI_API_KEY:-}
      - Integrations__SlackWebhookUrl=${SLACK_WEBHOOK_URL:-}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-support@supportpilot.io}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-redis:6379,abortConnect=false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - supportpilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportpilot-frontend-prod
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - supportpilot-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  postgres_data_prod:
    name: supportpilot_postgres_data_prod
  redis_data_prod:
    name: supportpilot_redis_data_prod

networks:
  supportpilot-network:
    name: supportpilot-prod-network
    driver: bridge
